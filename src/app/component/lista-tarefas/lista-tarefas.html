<div class="lista-tarefas">
  <h1>Minhas tarefas</h1>

  <div class="form-tarefa">
    <input type="text" placeholder="Digite uma nova tarefa..." [(ngModel)]="novaTarefa" />

    <button type="button" (click)="adicionarTarefa()">adicionar</button>
  </div>

  <ul>
    <li *ngFor="let tarefa of tarefas; let i = index">
      <input type="checkbox" [checked]="tarefa.concluida" (change)="marcarComoConcluida(i)" />

      <span class="descricao" [class.concluida]="tarefa.concluida">
        {{ tarefa.descricao }}
      </span>

      <button class="btn-remover" type="button" (click)="removerTarefa(i)" title="Remover tarefa">
        <i class="fi fi-rr-trash"></i>
      </button>
    </li>
  </ul>

  <p>Tarefas concluídas: {{ tarefasConcluidas.length }}</p>

  <div
    *ngIf="mensagem"
    class="mensagem"
    [class.sucesso]="tipoMensagem === 'sucesso'"
    [class.erro]="tipoMensagem === 'erro'"
  >
    {{ mensagem }}
  </div>
</div>
